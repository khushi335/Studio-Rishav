<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Rishav Internal — New Project Lead</title>
</head>
<body style="margin: 0; padding: 0; background-color: #fafafa; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #000000;">
    
    <!-- Outer Wrapper Table -->
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #fafafa; padding: 50px 20px;">
        <tr>
            <td align="center">
                <!-- Main Email Box -->
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 580px; background-color: #ffffff; border: 1px solid #e5e5e5; text-align: left;">
                    
                    <!-- Header Block -->
                    <tr>
                        <td style="padding: 40px; background-color: #000000; color: #ffffff;">
                            <span style="font-size: 10px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: #999999; display: block; margin-bottom: 8px;">
                                STUDIO RISHAV &bull; INBOUND BRIEF
                            </span>
                            <h2 style="font-family: 'Times New Roman', Times, 'Didot', serif; font-size: 24px; font-weight: 400; margin: 0; letter-spacing: 0.5px;">
                                {{ service }} &mdash; Project Alignment
                            </h2>
                        </td>
                    </tr>
                    
                    <!-- Content Block -->
                    <tr>
                        <td style="padding: 40px;">
                            
                            <!-- Structured Parameters Table -->
                            <table border="0" cellpadding="0" cellspacing="0" width="100%" style="font-size: 14px; line-height: 1.6; border-collapse: collapse;">
                                <tr>
                                    <td width="30%" style="color: #7f7f7f; font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; padding: 14px 0; border-bottom: 1px solid #eeeeee; vertical-align: middle;">
                                        Client
                                    </td>
                                    <td style="font-weight: 600; color: #000000; padding: 14px 0; border-bottom: 1px solid #eeeeee; vertical-align: middle;">
                                        {{ name }}
                                    </td>
                                </tr>
                                <tr>
                                    <td style="color: #7f7f7f; font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; padding: 14px 0; border-bottom: 1px solid #eeeeee; vertical-align: middle;">
                                        Phone
                                    </td>
                                    <td style="padding: 14px 0; border-bottom: 1px solid #eeeeee; vertical-align: middle;">
                                        <a href="tel:{{ phone }}" style="color: #000000; text-decoration: none; font-weight: 400; border-bottom: 1px solid #000000;">{{ phone }}</a>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="color: #7f7f7f; font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; padding: 14px 0; border-bottom: 1px solid #eeeeee; vertical-align: middle;">
                                        Email
                                    </td>
                                    <td style="padding: 14px 0; border-bottom: 1px solid #eeeeee; vertical-align: middle;">
                                        <a href="mailto:{{ email }}" style="color: #000000; text-decoration: none; font-weight: 400; border-bottom: 1px solid #000000;">{{ email }}</a>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="color: #7f7f7f; font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; padding: 14px 0; border-bottom: 1px solid #eeeeee; vertical-align: middle;">
                                        Target Date
                                    </td>
                                    <td style="color: #000000; font-weight: 400; padding: 14px 0; border-bottom: 1px solid #eeeeee; vertical-align: middle;">
                                        {{ event_date }}
                                    </td>
                                </tr>
                                <tr>
                                    <td style="color: #7f7f7f; font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; padding: 14px 0; border-bottom: 1px solid #eeeeee; vertical-align: middle;">
                                        Allocation
                                    </td>
                                    <td style="color: #000000; font-weight: 600; padding: 14px 0; border-bottom: 1px solid #eeeeee; vertical-align: middle;">
                                        {{ budget }}
                                    </td>
                                </tr>
                            </table>
                            
                            <!-- Project Summary / Message Block -->
                            <div style="margin-top: 35px; border: 1px solid #000000; padding: 25px;">
                                <h4 style="margin: 0 0 12px 0; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #000000;">
                                    Creative Intent & Vision
                               </h4>
                                <p style="margin: 0; font-size: 13px; line-height: 1.7; color: #333333; white-space: pre-wrap; font-weight: 300;">{{ message }}</p>
                            </div>
                            
                        </td>
                    </tr>
                    
                    <!-- Footer Notice -->
                    <tr>
                        <td style="padding: 0 40px 40px 40px; text-align: center;">
                            <p style="font-size: 10px; color: #999999; letter-spacing: 1px; margin: 0; text-transform: uppercase;">
                                High-Priority Notification &bull; Act Within 24 Hours
                            </p>
                        </td>
                    </tr>
                    
                </table>
            </td>
        </tr>
    </table>

</body>
</html>
